; PlatformIO Project Configuration File
;
; ESP32 firmware scaffold for multisite-sensorpack-mvp (GitHub issue #4).
; See src/firmware/README.md for build / test instructions.
;
; Scope note: this project intentionally implements only a scaffold
; (Wi-Fi connect, DHT22 read, LED/fan pin control stub). Device claim
; (issue #23) and telemetry/command-ACK networking (issue #24) are out
; of scope here and are implemented in later issues.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; Host-side unit test environment. Only src/firmware/lib (pure C++ logic,
; no Arduino/ESP32 dependency) and src/firmware/test are compiled here;
; src/firmware/src/main.cpp (Arduino-specific) is intentionally excluded
; by PlatformIO's default native test behaviour (test_build_src is not set).
[env:native]
platform = native
build_flags =
    -std=c++17
test_framework = unity
