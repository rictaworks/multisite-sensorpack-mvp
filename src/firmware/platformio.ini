; PlatformIO Project Configuration File
;
; ESP32 firmware scaffold for multisite-sensorpack-mvp (GitHub issue #4).
; See src/firmware/README.md for build / test instructions.
;
; Scope note: this project intentionally implements only a scaffold
; (Wi-Fi connect, DHT22 read, LED/fan pin control stub). Device claim
; (issue #23) and telemetry/command-ACK networking (issue #24) are out
; of scope here and are implemented in later issues.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -I src/claim
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.1.0
    tzapu/WiFiManager@^2.0.17

; Host-side unit test environment. src/firmware/lib (pure C++ logic, no
; Arduino/ESP32 dependency) and src/firmware/test are always compiled here.
;
; issue #23 adds src/firmware/src/claim/** (pure claim-code/JSON logic,
; host-testable) alongside src/firmware/src/wifi_provisioning/** and
; src/main.cpp (Arduino/ESP32-specific: AP mode, HTTPClient, Preferences -
; NOT host-testable). test_build_src is turned on so src/claim/** can be
; compiled into the native test binary, but build_src_filter explicitly
; excludes main.cpp and wifi_provisioning/** so this env never tries to
; compile Arduino-only code on the host.
[env:native]
platform = native
build_flags =
    -std=c++17
    -I src/claim
test_framework = unity
test_build_src = yes
build_src_filter =
    +<claim/>
    -<main.cpp>
    -<wifi_provisioning/>
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
