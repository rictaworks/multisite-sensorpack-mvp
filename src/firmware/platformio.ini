; PlatformIO Project Configuration File
;
; ESP32 firmware scaffold for multisite-sensorpack-mvp (GitHub issue #4),
; extended by device claim (issue #23) and telemetry/command-ACK networking
; + actuator control (issue #24). See src/firmware/README.md for build /
; test instructions.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -I src/claim
    -I src/telemetry
    -I src/actuators
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.1.0
    tzapu/WiFiManager@^2.0.17

; Host-side unit test environment. src/firmware/lib (pure C++ logic, no
; Arduino/ESP32 dependency) and src/firmware/test are always compiled here.
;
; issue #23 adds src/firmware/src/claim/** (pure claim-code/JSON logic,
; host-testable) alongside src/firmware/src/wifi_provisioning/** (Arduino/
; ESP32-specific: AP mode, HTTPClient, Preferences - NOT host-testable).
;
; issue #24 adds src/firmware/src/telemetry/** and src/firmware/src/
; actuators/**, each split the same way: telemetry_protocol.cpp/ack_queue.cpp
; and actuator_state.cpp are pure/host-testable, while telemetry_client.cpp
; (HTTPClient/WiFi transport) and actuator_driver.cpp (Arduino digitalWrite)
; are Arduino/ESP32-specific and excluded below.
;
; test_build_src is turned on so the pure logic above can be compiled into
; the native test binary, but build_src_filter explicitly excludes
; main.cpp, wifi_provisioning/**, telemetry_client.cpp, and
; actuator_driver.cpp so this env never tries to compile Arduino-only code
; on the host.
[env:native]
platform = native
build_flags =
    -std=c++17
    -I src/claim
    -I src/telemetry
    -I src/actuators
test_framework = unity
test_build_src = yes
build_src_filter =
    +<claim/>
    +<telemetry/>
    +<actuators/>
    -<main.cpp>
    -<wifi_provisioning/>
    -<telemetry/telemetry_client.cpp>
    -<actuators/actuator_driver.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
