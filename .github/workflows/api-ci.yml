name: API CI (RSpec)

on:
  pull_request:
    paths:
      - "src/api/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/api/**"
      - ".github/workflows/api-ci.yml"

defaults:
  run:
    working-directory: src/api

jobs:
  rspec:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # working-directory配下の.ruby-versionを自動検出させる(ruby-version未指定時の挙動)。
          bundler-cache: true
          working-directory: src/api

      - name: Set up database
        run: bin/rails db:prepare

      - name: Run RSpec
        run: bundle exec rspec
