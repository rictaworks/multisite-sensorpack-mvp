name: API CI (RSpec)

# パスフィルタは意図的に付けない。このワークフローはmainの必須ステータスチェックに
# 指定されており、"Require branches to be up to date before merging" と組み合わせている。
# パスで絞ると、src/api を変更しないPRでは起動せず、GitHubが結果を待ち続けて
# マージ不能になる(必須チェックの未報告はpending扱いになるため)。
on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: src/api

jobs:
  rspec:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # working-directory配下の.ruby-versionを自動検出させる(ruby-version未指定時の挙動)。
          bundler-cache: true
          working-directory: src/api

      - name: Set up database
        run: bin/rails db:prepare

      - name: Run RSpec
        run: bundle exec rspec
