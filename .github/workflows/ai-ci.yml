name: AI Service CI

on:
  pull_request:
    paths:
      - "src/ai/**"
      - ".github/workflows/ai-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/ai/**"
      - ".github/workflows/ai-ci.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ai
    env:
      # CIでの実行環境。.claude/rules/environment.md に基づき環境変数を単一の
      # 情報源として判定する（シークレットは含まない）。
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/ai/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v
