name: web-ci

# .claude/rules/ci-cd.md: Next.js CI (lint + Jest) must run on PRs and on
# pushes to main. CD (actual deployment) is intentionally out of scope here
# and is configured separately via Claude Desktop (.claude/rules/deploy.md).
on:
  pull_request:
    paths:
      - "src/web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/web/**"
      - ".github/workflows/web-ci.yml"

defaults:
  run:
    working-directory: src/web

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Jest
        run: npm test -- --ci
