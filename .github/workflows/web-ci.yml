name: web-ci

# .claude/rules/ci-cd.md: Next.js CI (lint + Jest) must run on PRs and on
# pushes to main. CD (actual deployment) is intentionally out of scope here
# and is configured separately via Claude Desktop (.claude/rules/deploy.md).
#
# パスフィルタは意図的に付けない（api-ci.yml と同じ理由）。必須ステータスチェックに
# 指定されているため、パスで絞ると対象外のPRで起動せず、結果待ちでマージ不能になる。
on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: src/web

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Jest
        run: npm test -- --ci
